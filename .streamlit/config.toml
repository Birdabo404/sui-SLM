# Dark Polaris theme (primary). Fonts in app/static, served at /app/static/<file>.
[server]
enableStaticServing = true
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Ubuntu Sans"
url = "app/static/UbuntuSans-Variable-Latin.woff2"
weight = "300 700"
style = "normal"
[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/JetBrainsMono-Regular.woff2"
weight = 400
style = "normal"
[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/JetBrainsMono-SemiBold.woff2"
weight = 600
style = "normal"

[theme]
base = "dark"
primaryColor = "#F7BC57"
backgroundColor = "#0F131A"
secondaryBackgroundColor = "#20252F"
textColor = "#EBEDF1"
font = "'Ubuntu Sans', sans-serif"
headingFont = "'Ubuntu Sans', sans-serif"
codeFont = "'JetBrains Mono', monospace"
baseFontSize = 15

[theme.sidebar]
backgroundColor = "#171C24"
secondaryBackgroundColor = "#20252F"
