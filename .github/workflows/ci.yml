name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        profile: [base, enhanced]
    env:
      ANONYMIZED_TELEMETRY: "False"
      HF_HUB_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SUI_SLM_CHECK_PINS: "1"
      SUI_SLM_CHECK_ENHANCED: ${{ matrix.profile == 'enhanced' && '1' || '0' }}
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-enhanced.txt

      - name: Install Python dependencies
        env:
          REQUIREMENTS_FILE: ${{ matrix.profile == 'enhanced' && 'requirements-enhanced.txt' || 'requirements.txt' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r "$REQUIREMENTS_FILE" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip check

      - name: Run unit tests without Ollama
        run: python -m unittest discover -s tests -v

      - name: Check installer shell
        run: |
          shellcheck install.sh
          bash -n install.sh
